# ============================================================
# 信息源清单:加源只改这里,下次运行自动生效
# region: overseas = GitHub Actions 抓取 / cn = 国内设备抓取
# tier: 1 = 聚合器(高频) 2 = 机构页 3 = 基金
# ============================================================
sources:
  # ---- 以下三个 feed 已逐一验证可用(2026-09) ----
  - name: on-the-move
    url: https://on-the-move.org/feed/
    type: rss
    region: overseas
    tier: 1

  - name: res-artis
    url: https://resartis.org/feed/
    type: rss
    region: overseas
    tier: 1

  - name: curating-info
    url: https://curating.org/feed
    type: rss
    region: overseas
    tier: 1

  # ---- 以下三个为逆向提取(2026-09 实测验证)----
  - name: e-flux
    url: https://www.e-flux.com/announcements/
    type: eflux
    region: overseas
    tier: 1

  - name: artconnect
    url: https://www.artconnect.com/opportunities/residencies
    type: artconnect
    region: overseas
    tier: 1

  - name: rivet
    url: https://rivet.es/calls/
    type: webpage
    link_pattern: /calls/view/
    region: overseas
    tier: 1

  # ---- 国内机构官网(2026-09 实测:海外 IP 可达,Actions 直接抓)----
  - name: a4-museum
    url: https://www.a4artmuseum.com/en/a4-residencyartcenter/residing/latest-recruitment/
    type: webpage
    link_pattern: /
    region: overseas
    tier: 2

  - name: dunhuang-museum
    url: https://www.dunhuangartmuseum.com/895439641007-1
    type: webpage
    link_pattern: /
    region: overseas
    tier: 2

  # ============================================================
