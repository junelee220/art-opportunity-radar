# ============================================================
# 信息源清单:加源只改这里,下次运行自动生效
# region: overseas = GitHub Actions 抓取 / cn = 国内设备抓取
# tier: 1 = 聚合器(高频) 2 = 机构页 3 = 基金
# ============================================================
sources:
  # ---- 以下三个 feed 已逐一验证可用(2026-09) ----
  - name: on-the-move
    url: https://on-the-move.org/feed/
    type: rss
    region: overseas
    tier: 1

  - name: res-artis
    url: https://resartis.org/feed/
    type: rss
    region: overseas
    tier: 1

  - name: curating-info
    url: https://curating.org/feed
    type: rss
    region: overseas
    tier: 1

  # ---- 以下三个为逆向提取(2026-09 实测验证)----
  - name: e-flux
    url: https://www.e-flux.com/announcements/
    type: eflux
    region: overseas
    tier: 1

  - name: artconnect
    url: https://www.artconnect.com/opportunities/residencies
    type: artconnect
    region: overseas
    tier: 1

  - name: rivet
    url: https://rivet.es/calls/
    type: webpage
    link_pattern: /calls/view/
    region: overseas
    tier: 1

  # ============================================================
  # 仍未接入(2026-09 复核):
  # ACA artistcommunities.org — JS 渲染,无 JSON API(wp-json 404)
  # TransArtists — 反爬(403),均待 changedetection.io(国内设备)
  # China Residencies — 放弃:内容陈旧(目录条目止于 2021),
  #   是机构目录站而非机会流,监控价值低
  # RSSHub 已查无这些站点的现成路由,未来若有可直接换用
  # ============================================================

  # ============================================================
  # 国内源:在 cn-node 部署 WeWe RSS 后,把生成的 feed 地址
  # 填到这里并取消注释(region 必须是 cn)。示例:
  #
  # - name: byartmatters-wechat
  #   url: http://192.168.x.x:4000/feeds/xxxx.xml
  #   type: rss
  #   region: cn
  #   tier: 1
